[project]
name = "opscore"
version = "0.1.0"
description = "Multi-tenant event, alert and evidence platform for oil & gas and maritime operations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "email-validator>=2.3",
    "bcrypt>=5.0",
    "pyjwt>=2.10",
    "psycopg[binary]>=3.2",
    "anthropic>=1.15",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel.scripts]
# Builds data/opscore.db (tables and the four sample clients) so the deployment ships a
# ready database and needs no database service. See app/bundled_db.py.
build = "python build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "postgres: needs a real PostgreSQL server (set OPSCORE_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI dependencies are declared in defaults by design
    "RUF012",
    "UP046",  # explicit TypeVar generics read better for most of the team
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "F811"]  # fixtures shared by importing them
"alembic/*" = ["E501"]
"app/assistant/language.py" = ["E501", "SIM905"]  # word lists
